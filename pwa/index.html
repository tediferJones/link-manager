<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkman</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const spaPath = searchParams.get('spaPath');
      if (spaPath) window.history.replaceState(null, '', spaPath);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
